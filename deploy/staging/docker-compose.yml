services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${STAGING_POSTGRES_USER}
      POSTGRES_PASSWORD: ${STAGING_POSTGRES_PASSWORD}
      POSTGRES_DB: ${STAGING_POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${STAGING_POSTGRES_USER} -d ${STAGING_POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks:
      - shisa

  nats:
    image: nats:2.11-alpine
    restart: unless-stopped
    command: ["nats-server", "--config", "/etc/nats/nats.conf"]
    volumes:
      - natsdata:/data
      - ./nats.conf:/etc/nats/nats.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8222/healthz || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks:
      - shisa

  prometheus:
    image: prom/prometheus:v3.2.0
    restart: unless-stopped
    volumes:
      - promdata:/prometheus
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:9090/-/healthy || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks:
      - shisa

  loki:
    image: grafana/loki:3.4.0
    restart: unless-stopped
    volumes:
      - lokidata:/loki
      - ./loki.yml:/etc/loki/local-config.yaml:ro
    command: ["-config.file=/etc/loki/local-config.yaml"]
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3100/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks:
      - shisa

  tempo:
    image: grafana/tempo:2.7.0
    restart: unless-stopped
    volumes:
      - tempodata:/var/tempo
      - ./tempo.yml:/etc/tempo/tempo.yaml:ro
    command: ["-config.file=/etc/tempo/tempo.yaml"]
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3200/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks:
      - shisa

  grafana:
    image: grafana/grafana:11.6.0
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${STAGING_GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${STAGING_GRAFANA_ADMIN_PASSWORD}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_AUTH_DISABLE_LOGIN_FORM: "false"
    volumes:
      - grafanadata:/var/lib/grafana
      - ./grafana/datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml:ro
    depends_on:
      prometheus:
        condition: service_healthy
      loki:
        condition: service_healthy
      tempo:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    networks:
      - shisa

  migrate:
    image: ${IMAGE_PREFIX}/migrate:${IMAGE_TAG}
    restart: "no"
    profiles: ["tools"]
    environment:
      DATABASE_URL: postgres://${STAGING_POSTGRES_USER}:${STAGING_POSTGRES_PASSWORD}@postgres:5432/${STAGING_POSTGRES_DB}?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - shisa

  trading:
    image: ${IMAGE_PREFIX}/trading:${IMAGE_TAG}
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://${STAGING_POSTGRES_USER}:${STAGING_POSTGRES_PASSWORD}@postgres:5432/${STAGING_POSTGRES_DB}?sslmode=disable
      NATS_URL: nats://nats:4222
      GRPC_PORT: "9001"
      HTTP_PORT: "8080"
      METRICS_PORT: "9091"
      OTEL_EXPORTER_OTLP_ENDPOINT: tempo:4317
      APIKEY_DERIVATION_SECRET: ${STAGING_APIKEY_DERIVATION_SECRET}
      APIKEY_ENCRYPTION_KEY: ${STAGING_APIKEY_ENCRYPTION_KEY}
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8080/healthz || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks:
      - shisa

  platform:
    image: ${IMAGE_PREFIX}/platform:${IMAGE_TAG}
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://${STAGING_POSTGRES_USER}:${STAGING_POSTGRES_PASSWORD}@postgres:5432/${STAGING_POSTGRES_DB}?sslmode=disable
      NATS_URL: nats://nats:4222
      GRPC_PORT: "9002"
      HTTP_PORT: "8081"
      METRICS_PORT: "9092"
      OTEL_EXPORTER_OTLP_ENDPOINT: tempo:4317
      POLYGON_RPC_URL: ${STAGING_POLYGON_RPC_URL}
      CONDITIONAL_TOKENS_ADDRESS: ${STAGING_CONDITIONAL_TOKENS_ADDRESS}
      NEG_RISK_ADAPTER_ADDRESS: ${STAGING_NEG_RISK_ADAPTER_ADDRESS}
      COLLATERAL_TOKEN_ADDRESS: ${STAGING_COLLATERAL_TOKEN_ADDRESS}
      JWT_ACCESS_SECRET: ${STAGING_JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${STAGING_JWT_REFRESH_SECRET}
      SIWE_DOMAIN: ${STAGING_TAILSCALE_HOSTNAME}
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8081/healthz || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks:
      - shisa

  settlement:
    image: ${IMAGE_PREFIX}/settlement:${IMAGE_TAG}
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://${STAGING_POSTGRES_USER}:${STAGING_POSTGRES_PASSWORD}@postgres:5432/${STAGING_POSTGRES_DB}?sslmode=disable
      NATS_URL: nats://nats:4222
      METRICS_PORT: "9093"
      OTEL_EXPORTER_OTLP_ENDPOINT: tempo:4317
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:9093/healthz || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks:
      - shisa

  indexer:
    image: ${IMAGE_PREFIX}/indexer:${IMAGE_TAG}
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://${STAGING_POSTGRES_USER}:${STAGING_POSTGRES_PASSWORD}@postgres:5432/${STAGING_POSTGRES_DB}?sslmode=disable
      NATS_URL: nats://nats:4222
      METRICS_PORT: "9094"
      OTEL_EXPORTER_OTLP_ENDPOINT: tempo:4317
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:9094/healthz || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks:
      - shisa

  caddy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    ports:
      - "${STAGING_TAILSCALE_IP}:8443:8443"
      - "${STAGING_TAILSCALE_IP}:8444:8444"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./certs:/etc/caddy/certs:ro
      - caddydata:/data
      - caddyconfig:/config
    depends_on:
      trading:
        condition: service_healthy
      platform:
        condition: service_healthy
    networks:
      - shisa

volumes:
  pgdata:
  natsdata:
  promdata:
  grafanadata:
  lokidata:
  tempodata:
  caddydata:
  caddyconfig:

networks:
  shisa:
    driver: bridge
